<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17242c" />
    <title>Customer login | ARCWAY</title>
    <meta
      name="description"
      content="ARCWAY. Every parcel has a path. Explore shipping options, estimate a rate and follow your parcel’s journey."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/graphics/favicon.svg"
    />
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dark-mode.css" />
    <link rel="stylesheet" href="../assets/css/rtl.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
    <script defer src="../assets/js/site-config.js"></script>
    <script defer src="../assets/js/city-data.js"></script>
    <script defer src="../assets/js/service-data.js"></script>
    <script defer src="../assets/js/utils.js"></script>
    <script defer src="../assets/js/shipment-data.js"></script>
    <script defer src="../assets/js/main.js"></script>
    <script defer src="../assets/js/auth.js"></script>
  </head>
  <body data-page="login">
    <noscript
      ><p class="notice" style="margin: 16px">
        Enable JavaScript to use navigation, shipping tools and the local
        customer workspace. This is a frontend demonstration; no delivery
        service is connected.
      </p></noscript
    >
    <div class="auth-page">
      <div class="auth-top">
        <div class="auth-tools">
          <button class="icon-btn" data-theme-toggle aria-label="Switch theme">
            <span data-icon="sun"></span></button
          ><button
            class="icon-btn"
            data-direction
            aria-label="Switch reading direction"
          >
            RTL
          </button>
        </div>
      </div>
      <main class="auth-main" id="main">
        <div class="auth-brand" data-logo></div>
        <h1>Welcome back.</h1>
        <p>Sign in to your customer account.</p>
        <form class="auth-form" data-auth-form="login">
          <div class="field">
            <label for="auth-email">Email address</label
            ><input
              id="auth-email"
              type="email"
              name="email"
              autocomplete="email"
              maxlength="180"
              required
            />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <div class="password-field">
              <input
                id="login-password"
                type="password"
                name="password"
                minlength="8"
                maxlength="128"
                autocomplete="current-password"
                required
              /><button
                class="password-toggle"
                type="button"
                data-password-toggle="login-password"
                aria-label="Show password"
                aria-pressed="false"
              >
                <span data-icon="eye"></span>
              </button>
            </div>
          </div>
          <div class="auth-row">
            <label class="checkbox"
              ><input type="checkbox" name="remember" />Remember Me</label
            ><button class="link-button" type="button" data-forgot>
              Forgot Password?
            </button>
          </div>
          <button class="btn btn-primary auth-submit" type="submit">
            Sign In <span data-icon="arrow"></span>
          </button>
        </form>
        <div
          class="auth-feedback"
          id="auth-feedback"
          role="status"
          aria-live="polite"
        ></div>
        <div class="auth-divider">or continue with</div>
        <div class="provider-buttons">
          <button class="provider-button" data-provider="Google">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#4285F4"
                d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"
              />
              <path
                fill="#34A853"
                d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.06.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.06v2.59A10 10 0 0 0 12 22Z"
              />
              <path
                fill="#FBBC05"
                d="M6.41 13.92a6 6 0 0 1 0-3.84V7.49H3.06a10 10 0 0 0 0 9.02l3.35-2.59Z"
              />
              <path
                fill="#EA4335"
                d="M12 5.96c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.62 9.62 0 0 0 12 2a10 10 0 0 0-8.94 5.49l3.35 2.59C7.2 7.72 9.4 5.96 12 5.96Z"
              />
            </svg>
            Google</button
          ><button class="provider-button" data-provider="Apple">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path
                d="M17.05 12.54c.02 3.13 2.75 4.17 2.78 4.18-.02.08-.44 1.5-1.45 2.96-.87 1.26-1.77 2.51-3.2 2.54-1.4.03-1.85-.82-3.45-.82-1.6 0-2.1.8-3.42.85-1.38.05-2.43-1.37-3.3-2.62-1.8-2.57-3.17-7.28-1.32-10.46.92-1.58 2.56-2.58 4.35-2.6 1.36-.02 2.64.92 3.46.92.82 0 2.36-1.13 3.98-.97.68.03 2.57.28 3.78 2.05-.1.06-2.25 1.31-2.22 3.97ZM14.4 4.7c.72-.88 1.21-2.09 1.08-3.3-1.04.04-2.31.69-3.06 1.57-.67.77-1.26 2-1.1 3.17 1.16.09 2.35-.59 3.08-1.44Z"
              />
            </svg>
            Apple
          </button>
        </div>
        <p class="auth-switch">
          New to ARCWAY? <a href="signup.html">Sign Up</a>
        </p>
      </main>
      <div class="auth-bottom">ARCWAY · Every parcel has a path.</div>
    </div>
    <dialog id="forgot-dialog" aria-labelledby="forgot-title">
      <div class="dialog-heading">
        <h2 id="forgot-title">Password recovery</h2>
        <button
          class="icon-btn"
          data-close-dialog
          aria-label="Close password recovery"
        >
          <span data-icon="close"></span>
        </button>
      </div>
      <p>A password reset requires a connected account service.</p>
      <form id="forgot-form">
        <div class="field">
          <label for="forgot-email">Account email</label
          ><input
            id="forgot-email"
            type="email"
            autocomplete="email"
            required
          />
        </div>
        <button class="btn btn-primary" style="margin-top: 20px" type="submit">
          Check recovery option
        </button>
        <div class="form-feedback" id="forgot-feedback" role="status"></div>
      </form>
    </dialog>
  </body>
</html>
